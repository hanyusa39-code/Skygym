<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SKY GYM - الإدارة الذكية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
/* التصميم العام */
body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin:0;
    padding:20px;
    color:white;
    background: url("skygem.png") no-repeat center center fixed;
    background-size: cover;
    filter: brightness(1.1) contrast(1.1);
}

.overlay{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background: linear-gradient(rgba(255,255,255,0.05), rgba(0,0,0,0.92));
    z-index:-1;
}

.brand{
    text-align:center;
    font-size:35px;
    font-weight:bold;
    margin-bottom:15px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.brand span{color:red;}

#notifyBox{
    background: rgba(20, 20, 20, 0.85);
    border-right: 5px solid red;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    background: rgba(30, 30, 30, 0.9);
    border: 1px solid #444;
    color: white;
    border-radius: 8px;
    box-sizing: border-box;
}

input:focus, select:focus { border-color: red; outline: none; }

.row { display: flex; gap: 10px; }

button{
    width:100%;
    padding:12px;
    background: linear-gradient(90deg, #d30000, #ff4d4d);
    color:white;
    border:none;
    margin-top:10px;
    border-radius:8px;
    cursor:pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover { opacity: 0.9; transform: scale(0.98); }

.durationBox{ display:flex; gap:5px; margin-top: 5px; }
.durationBox button{
    flex:1;
    background:#222;
    font-size:12px;
    border: 1px solid #444;
}

/* 💠 شبكة الكروت - صفين */
#list {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 25px;
    justify-content: space-between;
}

.card{
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 0, 0, 0.3);
    padding: 15px;
    border-radius: 15px;
    width: calc(50% - 8px); 
    box-sizing: border-box;
}

@media (max-width: 768px) { .card { width: 100%; } }

.info-line { font-size: 13px; margin: 4px 0; color: #ddd; }

.smallBtn{
    width: auto;
    padding: 6px 15px;
    font-size: 12px;
    background: #fff;
    color: #000;
    border-radius: 6px;
    margin-top: 10px;
    font-weight: bold;
}

.green{color:#00ff88; font-weight: bold;}
.yellow{color:yellow; font-weight: bold;}
.red{color:#ff4444; font-weight: bold;}

/* 🛠️ خانة المطور */
.developer-box {
    margin-top: 50px;
    text-align: center;
    padding: 25px;
    background: rgba(0, 0, 0, 0.8);
    border-top: 2px solid red;
    border-radius: 30px 30px 0 0;
}
.developer-box p { margin: 8px 0; font-size: 15px; color: #eee; }
.developer-box b { color: red; font-size: 20px; font-family: 'Courier New', Courier, monospace; }

.social-icons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
}
.social-icons a {
    color: white;
    font-size: 24px;
    transition: 0.3s;
    text-decoration: none;
}
.fa-facebook { color: #1877F2; }
.fa-instagram { color: #E4405F; }
.fa-telegram { color: #26A5E4; }
.social-icons a:hover { transform: scale(1.2); filter: brightness(1.2); }

</style>
</head>

<body>

<div id="loginBox" style="text-align:center;margin-top:100px;">
    <h2>SKY GYM LOGIN</h2>
    <input type="password" id="pass" placeholder="كلمة المرور" style="max-width:300px;">
    <button onclick="login()" style="max-width:300px;">دخول</button>
    <p id="error" style="color:red;"></p>
</div>

<div id="app" style="display:none;">
    <div class="overlay"></div>
    <div class="brand"><span>SKY</span> GYM</div>

    <div id="notifyBox">لا توجد إشعارات حالية</div>

    <input id="search" placeholder="🔍 ابحث بالاسم أو رقم الموبايل..." oninput="show()">

    <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 1px solid #333;">
        <input id="name" placeholder="الاسم الكامل">
        <div class="row">
            <input id="phone" placeholder="رقم الموبايل">
            <input id="address" placeholder="العنوان">
        </div>
        <div class="row">
            <select id="gender">
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
            <select id="goal">
                <option value="كمال أجسام">كمال أجسام</option>
                <option value="فيتنس">فيتنس</option>
                <option value="تخسيس">تخسيس</option>
            </select>
        </div>
        <div class="row">
            <input type="number" id="paid" placeholder="المبلغ المدفوع">
            <input type="number" id="rem" placeholder="المبلغ المتبقي">
        </div>
        <input type="number" id="customDays" placeholder="أدخل عدد الأيام يدوياً">
        <div class="durationBox">
            <button onclick="setDays(30)">شهر</button>
            <button onclick="setDays(60)">شهرين</button>
            <button onclick="setDays(90)">3 شهور</button>
        </div>
        <div id="selectedDays" style="text-align:center; margin-top:8px; font-size:12px; color:#aaa;">لم يتم اختيار مدة</div>
        <button onclick="addMember()">✅ تسجيل المشترك</button>
    </div>

    <div id="list"></div>

    <div class="developer-box">
        <p>تم التطوير بواسطة</p>
        <p><b>𝓗𝓪𝓷𝔂 𝓐𝓵-𝓦𝓪𝓻𝓯𝓪𝓵𝓲</b></p>
        
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="https://instagram.com/hann._.oon" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://t.me/ahm_ragel" target="_blank" title="Telegram"><i class="fab fa-telegram"></i></a>
        </div>
        
        <p style="font-size: 11px; margin-top: 15px; color: #777;">إدارة صالات الجيم 2026 © جميع الحقوق محفوظة</p>
    </div>
</div>

<script>
// الإعدادات
const PASSWORD = "112233";
const SUPABASE_URL = "https://zncxqfmyzizmnlteraai.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuY3hxZm15eml6bW5sdGVyYWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODg5MzYsImV4cCI6MjA5MzA2NDkzNn0.NIFeW3eGwZ5TqYEzj0b5Rb3jsbkyrfLS1C6mz2aZY2U";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let members = [];
let selectedDays = 0;

// الدخول
function login(){
    if(document.getElementById("pass").value === PASSWORD){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("app").style.display="block";
        loadMembers();
    }else{
        document.getElementById("error").innerText="كلمة المرور غير صحيحة";
    }
}

// تحميل البيانات
async function loadMembers(){
    let { data, error } = await client.from("members").select("*").order('id', { ascending: false });
    if(!error) { members = data || []; show(); notify(); }
}

// تحديد المدة
function setDays(d){
    selectedDays = d;
    document.getElementById("selectedDays").innerText = "تم تحديد " + d + " يوم";
}

// إضافة مشترك وتفريغ الحقول
async function addMember(){
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let gender = document.getElementById("gender").value;
    let goal = document.getElementById("goal").value;
    let paid = document.getElementById("paid").value || 0;
    let rem = document.getElementById("rem").value || 0;
    let custom = document.getElementById("customDays").value;

    let days = custom ? Number(custom) : selectedDays;
    if(!name || !phone || days <= 0){ alert("يرجى إكمال البيانات الأساسية"); return; }

    let now = Date.now();
    let end = now + (days * 86400000);

    const { error } = await client.from("members").insert([{
        name, phone, address, gender, goal, paid, rem, start: now, end: end
    }]);

    if(!error){
        // تفريغ الحقول بعد النجاح
        ["name", "phone", "address", "paid", "rem", "customDays"].forEach(id => document.getElementById(id).value = "");
        selectedDays = 0;
        document.getElementById("selectedDays").innerText = "لم يتم اختيار مدة";
        loadMembers();
    } else {
        alert("خطأ في الاتصال بقاعدة البيانات");
    }
}

// تجديد الاشتراك
async function renew(id, currentEnd){
    if(!confirm("تجديد الاشتراك لـ 30 يوم إضافي؟")) return;
    let now = Date.now();
    let newEnd = (currentEnd > now) ? currentEnd + (30 * 86400000) : now + (30 * 86400000);
    await client.from("members").update({end: newEnd}).eq("id", id);
    loadMembers();
}

// حذف مشترك
async function del(id){
    if(!confirm("هل أنت متأكد من الحذف؟")) return;
    await client.from("members").delete().eq("id", id);
    loadMembers();
}

// الإشعارات
function notify(){
    let box = document.getElementById("notifyBox");
    let now = Date.now();
    let msgs = members.map(m => {
        let diff = Math.ceil((m.end - now)/86400000);
        if(diff <= 3 && diff > 0) return `🟡 ${m.name} (باقي ${diff} يوم)`;
        if(diff <= 0) return `🔴 ${m.name} (انتهى اشتراكه)`;
        return null;
    }).filter(x => x);
    box.innerHTML = msgs.length > 0 ? msgs.join("<br>") : "لا توجد تنبيهات حالياً";
}

// عرض الكروت (نظام الصفين)
function show(){
    let list = document.getElementById("list");
    list.innerHTML="";
    let search = document.getElementById("search").value.toLowerCase();
    let now = Date.now();

    members.filter(m => (m.name||"").toLowerCase().includes(search) || (m.phone||"").includes(search))
    .forEach(m => {
        let diff = Math.ceil((m.end - now)/86400000);
        let color = diff <= 0 ? "red" : (diff <= 3 ? "yellow" : "green");
        let status = diff <= 0 ? "منتهي" : (diff <= 3 ? "قرب يخلص" : "نشط");

        list.innerHTML += `
        <div class='card'>
            <div style="display:flex; justify-content:space-between;">
                <b>${m.name}</b>
                <span class="${color}">${status}</span>
            </div>
            <div class="info-line">📍 ${m.address || 'بدون عنوان'}</div>
            <div class="info-line">📞 ${m.phone} | ${m.gender}</div>
            <div class="info-line">🎯 الهدف: ${m.goal}</div>
            <div class="info-line" style="background:rgba(255,255,255,0.1); padding:4px; border-radius:4px;">
                💰 مدفوع: ${m.paid} | متبقي: ${m.rem}
            </div>
            <div class="info-line">⏳ المتبقي: ${diff} يوم</div>
            <div style="border-top:1px solid #333; margin-top:8px;">
                <button class='smallBtn' onclick='renew(${m.id}, ${m.end})'>تجديد</button>
                <button class='smallBtn' style="background:#ff4444; color:white;" onclick='del(${m.id})'>حذف</button>
            </div>
        </div>`;
    });
}
</script>

</body>
</html>
